<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Support template</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap"
    />
    <style>
      body {
        margin: 0;
        padding: 28px 16px 48px;
        font-family: system-ui, sans-serif;
        background: #e9e5de;
        color: #121110;
      }
      body.dark {
        background: #0b0b0c;
        color: #f4f1ea;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        max-width: 960px;
        margin: 0 auto 40px;
      }
      nav div {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      button {
        font: inherit;
        padding: 8px 14px;
        border-radius: 10px;
        border: 1px solid #ddd7cd;
        background: #fbfaf7;
        color: #121110;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <nav>
      <strong>Field Notes</strong>
      <div>
        <button type="button" data-theme-toggle>Light / dark</button>
        <button type="button" data-cheerkit-open="my-work">
          Buy me a coffee
        </button>
      </div>
    </nav>

    <cheerkit-support
      api="/api/support"
      context="my-work"
      currency="NGN"
      layout="page"
    ></cheerkit-support>
    <cheerkit-support
      api="/api/support"
      context="my-work"
      currency="NGN"
      layout="dialog"
    ></cheerkit-support>

    <script type="module">
      import "/ui/define.js";
      const config = {
        name: "Kemi Lawal",
        tagline: "Field Notes",
        question: "Buy Kemi a coffee",
        where: "Keeps the weekly letter free to read.",
      };
      const elements = document.querySelectorAll("cheerkit-support");
      for (const element of elements) element.config = config;
      document
        .querySelector("[data-theme-toggle]")
        .addEventListener("click", () => {
          const dark = document.body.classList.toggle("dark");
          for (const element of elements)
            element.setAttribute("theme", dark ? "dark" : "light");
        });
    </script>
  </body>
</html>
